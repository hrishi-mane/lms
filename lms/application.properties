spring.application.name=lms

# Pull configuration from Config Server before context loads
spring.config.import=optional:configserver:http://localhost:8888

# Active profile — change to 'prod' for production
spring.profiles.active=dev

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port:8081}

# Fallback port if config server is unavailable
server.port=8081
